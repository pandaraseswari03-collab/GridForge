name: GridForge targeted remediation

on:
  push:
    branches:
      - 'remediation/**'

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy
      - name: Syntax-check remediation files
        run: >-
          python -m py_compile
          core/analysis/contingency.py
          core/analysis/line_flow.py
          core/analysis/power_flow.py
          core/analysis/power_flow_preparation.py
          core/analysis/power_flow_result_conversion.py
          core/analysis/transformer_flow.py
          core/solver/power_flow/result.py
          core/solver/power_flow/__init__.py
          tests/core/analysis/test_power_flow_engineering_result_chain.py
          tests/core/solver/test_power_flow_result_contract.py
      - name: Run isolated authoritative-result tests
        run: python -m pytest -q tests/core/solver/test_power_flow_result_contract.py
      - name: Run GF-AUD-007 focused tests
        run: python -m pytest -q tests/core/analysis/test_power_flow_engineering_result_chain.py
      - name: Run existing targeted regression tests
        run: >-
          python -m pytest -q
          tests/core/analysis/test_open_partial_preparation_contracts.py
          tests/core/analysis/test_power_flow_study_configuration_contract.py
          tests/core/analysis/test_short_circuit_preparation_contract.py
          tests/core/application/test_measurement_command_authority.py
          tests/core/application/test_measurement_command_contract.py
          tests/core/application/test_protection_trip_boundary.py
          tests/core/measurement/test_measurement_conversion_contract.py
          tests/core/model/test_transformer_impedance_basis.py
          tests/core/test_measurement_generation.py
          tests/projects/test_gridforge_package.py
